services:
  - type: web
    name: outils-educsp-moteur-bilan
    runtime: node
    plan: free
    branch: claude/moteur-bilan-spec-nxjqrc
    # `--include=dev` est indispensable : avec NODE_ENV=production, npm omet
    # les dépendances de développement, et ni tsc ni tsx ne seraient installés.
    #
    # `vendor:asr` est réappelé explicitement, sans son mode tolérant : le
    # postinstall laisse passer un téléchargement raté pour ne pas bloquer une
    # installation hors ligne, ce qui est le bon choix sur un poste — mais ici,
    # cela déploierait une instance dont la dictée échoue au premier clic. Mieux
    # vaut un déploiement en échec, visible tout de suite.
    buildCommand: npm ci --include=dev && npm run vendor:asr && npm run build
    # Migration exécutée depuis le JavaScript compilé : tsx n'a pas à être
    # présent au démarrage.
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      # Décide notamment que le cookie de session exige HTTPS. Sans cette
      # variable, le cookie serait posé sans l'attribut `secure` et pourrait
      # partir en clair si la connexion était un jour dégradée.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: outils-educsp-db
          property: connectionString
      - key: LLM_PROVIDER
        value: cerebras
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      # Clé secrète : à renseigner manuellement dans le dashboard Render
      # (Environment), jamais commitée dans ce fichier.
      - key: CEREBRAS_API_KEY
        sync: false
      # La dictée vocale ne demande aucune variable : elle est transcrite dans
      # le navigateur de l'éducateur, l'audio n'atteint jamais ce service.

databases:
  - name: outils-educsp-db
    plan: free
    databaseName: outils_educsp
    user: outils_educsp
