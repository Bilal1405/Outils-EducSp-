services:
  - type: web
    name: outils-educsp-moteur-bilan
    runtime: node
    plan: free
    branch: claude/moteur-bilan-spec-nxjqrc
    buildCommand: npm install && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      # Décide notamment que le cookie de session exige HTTPS. Sans cette
      # variable, le cookie serait posé sans l'attribut `secure` et pourrait
      # partir en clair si la connexion était un jour dégradée.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: outils-educsp-db
          property: connectionString
      - key: LLM_PROVIDER
        value: cerebras
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      # Clé secrète : à renseigner manuellement dans le dashboard Render
      # (Environment), jamais commitée dans ce fichier.
      - key: CEREBRAS_API_KEY
        sync: false
      # La dictée vocale ne demande aucune variable : elle est transcrite dans
      # le navigateur de l'éducateur, l'audio n'atteint jamais ce service.

databases:
  - name: outils-educsp-db
    plan: free
    databaseName: outils_educsp
    user: outils_educsp
